version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ml-stack:
        applies-to: version-updates
        patterns:
          - torch
          - transformers
          - tokenizers
          - sentencepiece
          - protobuf
          - numpy
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
