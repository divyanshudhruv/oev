name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.3.1 (defaults to the pyproject version)"
        required: false
        default: ""

permissions: read-all

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Resolve version and parity (tag or dispatch input)
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          python - <<'PY'
          import os, re, tomllib
          event = os.environ["GITHUB_EVENT_NAME"]
          if event == "workflow_dispatch":
              ver = os.environ["DISPATCH_VERSION"].strip() or tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          else:
              ver = os.environ["GITHUB_REF_NAME"].lstrip("v")
          py = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          src = open("oev/__init__.py", encoding="utf-8").read()
          init = re.search(r'__version__\s*=\s*"([^"]+)"', src).group(1)
          assert ver == py == init, f"version mismatch: {ver} != pyproject {py} != __init__ {init}"
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"OEV_VERSION={ver}\n")
          print("version parity OK:", ver)
          PY

      - name: Install build tools (hash-pinned)
        run: python -m pip install --require-hashes --no-deps -r ci/requirements.txt

      - name: Build wheel and sdist
        # --no-isolation: build from the hash-locked toolchain, not an
        # unpinned isolated env
        run: python -m build --no-isolation

      - name: Attest build provenance (signed release artifacts)
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: "dist/*"

      - name: Twine check
        run: python -m twine check dist/*

      - name: Extract release notes from CHANGELOG.md
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import os, re
          ver = os.environ["OEV_VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(ver)}\b.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          if m and m.group(1).strip():
              body = (m.group(1).strip()
                      + "\n\nFull history: [CHANGELOG.md](https://github.com/divyanshudhruv/oev/blob/main/CHANGELOG.md)"
                        " - benchmarks and the experimental record in [BENCHMARKS.md](https://github.com/divyanshudhruv/oev/blob/main/BENCHMARKS.md).")
          else:
              body = (f"Published to PyPI as `oev {ver}`. No CHANGELOG section was found for "
                        "this version - benchmarks and the full experimental record live in "
                        "[BENCHMARKS.md](https://github.com/divyanshudhruv/oev/blob/main/BENCHMARKS.md).")
          with open("release_notes.md", "w", encoding="utf-8") as fh:
              fh.write(body)
          print(f"release notes ready ({len(body)} chars)")
          PY

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

      - name: Create GitHub release (tag pushes only)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: OEV v${{ env.OEV_VERSION }}
          body_path: release_notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
