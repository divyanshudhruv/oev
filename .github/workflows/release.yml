name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.2.0 (defaults to the pyproject version)"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve version and parity (tag or dispatch input)
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          python - <<'PY'
          import os, re, tomllib
          event = os.environ["GITHUB_EVENT_NAME"]
          if event == "workflow_dispatch":
              ver = os.environ["DISPATCH_VERSION"].strip() or tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          else:
              ver = os.environ["GITHUB_REF_NAME"].lstrip("v")
          py = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          src = open("oev/__init__.py", encoding="utf-8").read()
          init = re.search(r'__version__\s*=\s*"([^"]+)"', src).group(1)
          assert ver == py == init, f"version mismatch: {ver} != pyproject {py} != __init__ {init}"
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"OEV_VERSION={ver}\n")
          print("version parity OK:", ver)
          PY

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub release (tag pushes only; v0.2.0 release already exists)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: OEV v${{ env.OEV_VERSION }}
          body: Published to PyPI as `oev ${{ env.OEV_VERSION }}`. Benchmarks and the full experimental record live in BENCHMARKS.md.
          draft: false
          prerelease: false
