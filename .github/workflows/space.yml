name: sync-space

on:
  push:
    branches: [main]
    paths: ["app.py", "requirements.txt", "pyproject.toml", "README.md", "HF_MODEL_CARD.md", "LICENSE", "oev/**", "space/**", ".github/workflows/space.yml"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install -q "huggingface_hub[cli]"
          hf upload divyanshudhruv/oev-demo app.py app.py --repo-type space
          hf upload divyanshudhruv/oev-demo oev oev --repo-type space
          hf upload divyanshudhruv/oev-demo pyproject.toml pyproject.toml --repo-type space
          hf upload divyanshudhruv/oev-demo space/README.md README.md --repo-type space
          hf upload divyanshudhruv/oev-demo LICENSE LICENSE --repo-type space
          hf upload divyanshudhruv/oev-demo requirements.txt requirements.txt --repo-type space
          hf upload divyanshudhruv/oev-typed HF_MODEL_CARD.md README.md --repo-type model
