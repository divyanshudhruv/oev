[project]
name = "oev"
version = "0.1.0"
description = "System One decision model: typed questions in, calibrated probability distributions out, one forward pass."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Divyanshu Dhruv", email = "71079602+divyanshudhruv@users.noreply.github.com" }]
keywords = ["decision-model", "calibration", "classification", "system-one", "deberta"]
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
data = ["datasets>=2.14"]
backbone = ["transformers>=4.40", "sentencepiece", "protobuf"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
oev-serve = "oev.serve:main"

[project.urls]
Homepage = "https://github.com/divyanshudhruv/oev"
Model = "https://huggingface.co/divyanshudhruv/oev-typed"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oev*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
